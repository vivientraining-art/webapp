<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilan de l'association · Vivien Strudel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1F3A2D; --pine:#2F5240; --sand:#F2EDE2; --linen:#FBF8F1; --ink:#22302A; --muted:#6E7B73;
    --terra:#C26B4A; --line:#DDD4C3; --sky:#3D7EA6; --up:#2F7D3D; --down:#B23A22;
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);background:var(--sand) radial-gradient(1100px 480px at 50% -12%,#F8F4EA,var(--sand)) no-repeat;
    -webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:16px 16px 40px}
  .hero{background:linear-gradient(135deg,#254531 0%,var(--forest) 55%,#16291F 100%);color:#F4F0E6;border-radius:20px;padding:26px 26px 22px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(194,107,74,.35),transparent 70%)}
  .hero small{display:block;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#C9D4CC}
  .hero h1{font-family:'Libre Baskerville',Georgia,serif;font-size:clamp(1.5rem,4.2vw,2.2rem);line-height:1.15;margin:.35rem 0 .3rem}
  .hero p{color:#D9E2DB;font-size:.95rem;max-width:620px;line-height:1.5}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
  .tile{background:var(--linen);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .tile .big{font-family:'Libre Baskerville',Georgia,serif;font-size:2rem;line-height:1.05;color:var(--forest)}
  .tile .lbl{font-size:.85rem;color:var(--muted);margin-top:.25rem;line-height:1.35}
  .tile.accent .big{color:var(--up)}
  .note{font-size:.86rem;color:#3F4D45;line-height:1.5;margin:4px 2px 14px}
  section{margin-top:18px}
  .sechead{display:flex;align-items:baseline;gap:.6rem;margin:0 2px 10px}
  .sechead h2{font-family:'Libre Baskerville',Georgia,serif;font-size:1.2rem;color:var(--forest)}
  .sechead span{font-size:.82rem;color:var(--muted)}
  .sechead::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);align-self:center}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:12px 14px 12px}
  .card h3{font-size:.95rem;font-weight:700;line-height:1.25}
  .card h3 span{font-weight:400;color:var(--muted);font-size:.8rem}
  .val{display:flex;align-items:baseline;gap:.4rem;margin:.35rem 0 .1rem}
  .val b{font-family:'Libre Baskerville',Georgia,serif;font-size:1.75rem;color:var(--ink);line-height:1}
  .val .sd{font-weight:700;color:var(--muted)}
  .meta{font-size:.76rem;color:var(--muted)}
  .gauge{position:relative;height:32px;margin:.5rem 6px .05rem}
  .gauge .ln{position:absolute;left:0;right:0;top:9px;height:2px;border-radius:1px;background:#DDD4C3}
  .gauge .tk{position:absolute;top:6px;width:2px;height:8px;margin-left:-1px;background:#DDD4C3}
  .gauge .bd{position:absolute;top:2px;height:16px;border-radius:8px;background:var(--c);opacity:.22}
  .gauge .pt{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff}
  .gauge .lo,.gauge .hi{position:absolute;top:19px;font-size:.68rem;color:var(--muted);line-height:1}.gauge .lo{left:-4px}.gauge .hi{right:-4px}
  .card.vide{background:transparent;border-style:dashed;border-top-style:solid;border-top-color:#D9D1C1}
  .card.vide h3{color:#6E7B73}.avenir{font-family:'Libre Baskerville',Georgia,serif;font-size:1.05rem;color:#9AA49D;margin:.45rem 0 .2rem}
  .evo{font-size:.84rem;margin-top:.35rem;line-height:1.45}
  .evo .ar{font-weight:700}.evo .ar.up{color:var(--up)}.evo .ar.down{color:var(--down)}
  .chip{display:inline-block;margin-top:.35rem;font-size:.78rem;font-weight:600;color:var(--up);background:#EAF3EC;border-radius:999px;padding:.12rem .55rem}
  .pbar{height:6px;border-radius:3px;background:#EEE8DC;margin-top:.35rem;overflow:hidden;display:flex}
  .pbar i{display:block;height:100%}
  .foot{font-size:.76rem;color:var(--muted);line-height:1.55;margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
  .bar{display:flex;gap:.6rem;justify-content:flex-end;margin-bottom:10px}
  .bar a,.bar button{font:inherit;font-weight:600;font-size:.9rem;border-radius:10px;padding:.5rem .9rem;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
  .bar button{background:var(--terra);color:#fff;border-color:var(--terra)}
  .msg{background:var(--linen);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;margin-top:16px;line-height:1.6}
  .msg a{color:var(--terra);font-weight:600}
  @media print{
    @page{size:A4 portrait;margin:9mm}
    body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:10px}
    .wrap{max-width:none;padding:0;zoom:.94}.bar{display:none}
    .hero{padding:12px 16px;border-radius:12px}.hero h1{font-size:1.35rem;margin:.2rem 0}.hero p{font-size:.85rem}
    .tiles{gap:8px;margin:8px 0;grid-template-columns:repeat(4,1fr)}.tile{padding:6px 10px}.tile .big{font-size:1.25rem}.tile .lbl{margin-top:.1rem}
    section{margin-top:10px;break-inside:avoid}.cards{gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.card{padding:8px 10px;break-inside:avoid}
    .val{margin:.2rem 0 0}.val b{font-size:1.25rem}.gauge{margin-top:.3rem;height:28px}.evo,.chip,.pbar{margin-top:.2rem}.note{margin:2px 0 4px}.foot{margin-top:6px;padding-top:6px}
    .sechead{margin-bottom:6px}.sechead h2{font-size:1.05rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a href="espace-adherent.html" id="retour">← Retour</a><button type="button" id="print">Imprimer / PDF</button></div>
  <div id="page"><div class="msg">Chargement…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"><\/script>');</script>
<script>
/* =====================================================================
   Bilan de l'association en une page — statistiques ANONYMES calculées par la
   base (fonction stats_groupe, migration 17) : moyennes, écarts-types, part de
   progrès ; jamais de valeur individuelle, rien en dessous de 5 personnes.
   Pour donner une idée du niveau global, pas pour se comparer.
   Accessible aux adhérents et au coach connectés.
   ===================================================================== */
const SUPABASE_URL      = 'https://mxdsvbrxeospfohgvzbz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MIO9ShdnMK1-mQm0T1J5YA_UPkAJ80_';
const $ = (s) => document.querySelector(s);
const fr = (x) => String(x).replace('.', ',');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r1 = (x) => Math.round(x * 10) / 10;

/* [clé, titre, unité, [début, fin] de l'échelle de la jauge, neutre (pas de « progrès » : l'intensité n'est ni bonne ni mauvaise)] */
const SECTIONS = [
  { titre: 'Cardio', sous: 'endurance et récupération', c: 'var(--terra)', ind: [
    ['amrap_tours', 'AMRAP 20 min', 'tours complets', [0, 10]],
    ['amrap_intensite', 'Intensité de l’AMRAP', '% de la FC max', [50, 100], true],
    ['hrr60', 'Récupération en 1 min', 'baisse de FC, bpm', [0, 60]]] },
  { titre: 'Force', sous: 'force maximale', c: 'var(--forest)', ind: [
    ['prehension', 'Préhension', 'kg, meilleure main', [0, 70]],
    ['squat', 'Squat', 'kg, 1RM estimé', [0, 150]], ['dc', 'Développé couché', 'kg, 1RM estimé', [0, 120]], ['rdl', 'RDL', 'kg, 1RM estimé', [0, 160]]] },
  { titre: 'Endurance de force', sous: 'maximum de répétitions', c: 'var(--sky)', ind: [
    ['pompes:jambes tendues', 'Pompes jambes tendues', 'répétitions', [0, 50]], ['pompes:genoux avec gainage', 'Pompes genoux, gainage', 'répétitions', [0, 50]],
    ['pompes:genoux sans gainage', 'Pompes genoux', 'répétitions', [0, 50]], ['wallsit', 'Wall-sit', 'secondes (plafond 300)', [0, 300]]] },
];

/* Jauge sur une échelle fixe propre à chaque test (de 0 au haut de l'échelle), pour que la largeur de la bande
   (± 1 écart-type) et la position de la moyenne parlent d'elles-mêmes ; l'échelle s'élargit si besoin.
   En HTML (pourcentages) plutôt qu'en SVG étiré : rien ne se déforme, quelle que soit la largeur de la carte. */
function gauge(m, sd, ech) {
  const lo = Math.min(ech[0], Math.floor(Math.max(0, m - sd))), hi = Math.max(ech[1], Math.ceil(m + sd));
  const P = (v) => ((Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * 100).toFixed(2) + '%';
  const a = Math.max(lo, m - sd), b = Math.min(hi, m + sd);
  return '<div class="gauge" aria-hidden="true"><i class="ln"></i>' +
    [0.25, 0.5, 0.75].map(f => '<i class="tk" style="left:' + f * 100 + '%"></i>').join('') +
    (sd > 0 ? '<i class="bd" style="left:' + P(a) + ';width:calc(' + P(b) + ' - ' + P(a) + ')"></i>' : '') +
    '<i class="pt" style="left:' + P(m) + '"></i><span class="lo">' + fr(lo) + '</span><span class="hi">' + fr(hi) + '</span></div>';
}

/* Carte « à venir » : le test fait partie du bilan mais n'a pas encore assez de résultats (5 personnes minimum). */
function videHtml(d, def, color) {
  const [cle, titre, unit] = def, asso = (d.stats || []).filter(s => s.scope === 'asso');
  const txt = ['squat', 'dc', 'rdl'].includes(cle) && !asso.some(s => ['squat', 'dc', 'rdl'].includes(s.cle)) ? 'avec la séance de tests de force max'
    : ['amrap_intensite', 'hrr60'].includes(cle) ? 'pas encore 5 mesures de FC valides (capteur cardiaque)'
    : 'pas encore 5 personnes testées';
  return '<article class="card vide" style="--c:' + color + '"><h3>' + esc(titre) + ' <span>· ' + esc(unit) + '</span></h3>' +
    '<div class="avenir">À venir</div><div class="meta">' + txt + '</div></article>';
}

function cardHtml(d, def, color) {
  const [cle, titre, unit, ech, neutre] = def;
  const st = (d.stats || []).filter(s => s.scope === 'asso' && s.cle === cle).sort((a, b) => a.pt.localeCompare(b.pt));
  if (!st.length) return videHtml(d, def, color);
  /* Niveau affiché : le dernier point de test, sauf s'il est encore en cours (moins de 70 % de l'effectif
     le plus large) — sinon une poignée de premiers testés donnerait une moyenne trompeuse. */
  const nMax = Math.max(...st.map(s => s.n)), last = [...st].reverse().find(s => s.n >= 0.7 * nMax) || st[st.length - 1];
  const m = Number(last.moyenne), sd = Number(last.ecart_type) || 0;
  const ev = (d.evolution || []).find(e => e.scope === 'asso' && e.cle === cle);
  /* Évolution : variation moyenne des MÊMES personnes entre leur premier et leur dernier test (et non la
     différence de deux moyennes calculées sur des groupes qui ne sont pas les mêmes). */
  let evo = '';
  if (ev && ev.variation_moyenne != null) {
    const dv = Number(ev.variation_moyenne), cls = neutre || !dv ? '' : dv > 0 ? 'up' : 'down';
    evo = '<div class="evo"><span class="ar ' + cls + '">' + (dv > 0 ? '▲ +' : dv < 0 ? '▼ −' : '= ') + fr(Math.abs(r1(dv))) +
      '</span> en moyenne d’un test à l’autre' + (neutre ? ' <span class="meta">(' + ev.n + ' pers.)</span>' : '') + '</div>';
  }
  let prog = '';
  if (ev && !neutre) {
    const p = ev.progres / ev.n * 100, s = ev.stable / ev.n * 100, b = ev.baisse / ev.n * 100;
    prog = '<div class="pbar" title="progrès net · stable · baisse"><i style="width:' + p + '%;background:var(--up)"></i><i style="width:' + s + '%;background:#CFC6B4"></i>' +
      '<i style="width:' + b + '%;background:#E3A08E"></i></div><span class="chip">' + ev.progres + ' sur ' + ev.n + ' en progrès net</span>';
  }
  return '<article class="card" style="--c:' + color + '"><h3>' + esc(titre) + ' <span>· ' + esc(unit) + '</span></h3>' +
    '<div class="val"><b>' + fr(r1(m)) + '</b>' + (sd ? '<span class="sd">± ' + fr(r1(sd)) + '</span>' : '') + '</div>' +
    '<div class="meta">au ' + last.pt + ', ' + last.n + ' pers.' + (sd ? ' · 2 sur 3 entre ' + fr(r1(Math.max(0, m - sd))) + ' et ' + fr(r1(m + sd)) : '') + '</div>' +
    gauge(m, sd, ech) + evo + prog + '</article>';
}

function render(d) {
  const pr = (d.profil || []).find(p => p.scope === 'asso');
  const evs = (d.evolution || []).filter(e => e.scope === 'asso' && e.cle !== 'amrap_intensite');
  const nEv = evs.reduce((a, e) => a + e.n, 0), nProg = evs.reduce((a, e) => a + e.progres, 0);
  const maxN = Math.max(0, ...(d.stats || []).filter(s => s.scope === 'asso').map(s => s.n));
  const date = d.calcule_le ? new Date(d.calcule_le).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const tiles = [
    [pr ? pr.personnes : maxN, pr ? 'adhérents testés' : 'adhérents testés (au moins)'],
    pr ? [pr.femmes + ' · ' + pr.hommes, 'femmes · hommes'] : null,
    pr && pr.age_moyen != null ? [pr.age_moyen + ' ans', 'âge moyen' + (pr.age_ecart_type ? ' (± ' + pr.age_ecart_type + ')' : '')] : null,
    nEv ? [Math.round(nProg / nEv * 100) + ' %', 'des résultats en progrès net', 'accent']
      : maxN ? [[...new Set((d.stats || []).map(s => s.pt))].sort().pop(), 'premier bilan : les progrès apparaîtront au test suivant'] : null,
  ].filter(Boolean);
  const sections = !maxN ? '' : SECTIONS.map(sec => {
    const cards = sec.ind.map(def => cardHtml(d, def, sec.c)).join('');
    return '<section><div class="sechead" style="--c:' + sec.c + '"><h2>' + sec.titre + '</h2><span>' + sec.sous + '</span></div><div class="cards">' + cards + '</div></section>';
  }).join('');
  $('#page').innerHTML =
    '<header class="hero"><small>Bilan anonyme · ' + esc(date) + '</small><h1>Le niveau de l’association</h1>' +
      '<p>Gironville, Milly et Boutigny réunis : où en est le groupe dans son ensemble, et comment il progresse.</p></header>' +
    '<div class="tiles">' + tiles.map(t => '<div class="tile ' + (t[2] || '') + '"><div class="big">' + esc(t[0]) + '</div><div class="lbl">' + esc(t[1]) + '</div></div>').join('') + '</div>' +
    '<p class="note">Une idée générale, <b>pas une compétition</b> : chacun part de son niveau, de son âge, de son histoire, et progresse à son rythme. ' +
      'Chaque carte montre la moyenne ± l’écart-type : la bande colorée couvre environ 2 personnes sur 3, le point est la moyenne.</p>' +
    (sections || '<div class="msg">Pas encore assez de personnes testées pour afficher des statistiques (5 au minimum par test).</div>') +
    '<p class="foot">Statistiques anonymes de tous les adhérents testés : aucune valeur individuelle, aucun classement, rien en dessous de 5 personnes. ' +
      '« En progrès net » : au-delà de la variabilité normale du test, entre le premier et le dernier test de chacun, dans les mêmes conditions. ' +
      '1RM estimé depuis un test à 5 répétitions (Brzycki). Intensité : FC moyenne de l’AMRAP en % de la FC max.</p>';
}

$('#print').addEventListener('click', () => window.print());
if (/moniteur-groupe-polar/.test(document.referrer)) $('#retour').href = 'moniteur-groupe-polar.html';
(async () => {
  if (typeof supabase === 'undefined') { $('#page').innerHTML = '<div class="msg">Connexion au service impossible (hors ligne ?).</div>'; return; }
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: s } = await sb.auth.getSession();
  if (!s || !s.session) { $('#page').innerHTML = '<div class="msg">Ce bilan est réservé aux adhérents.<br><a href="espace-adherent.html">Connecte-toi à ton espace</a>, puis reviens sur cette page.</div>'; return; }
  const { data, error } = await sb.rpc('stats_groupe');
  if (error) { $('#page').innerHTML = '<div class="msg">Le bilan de l’association n’est pas encore disponible.</div>'; return; }
  if (!data || !data.ouvert) { $('#page').innerHTML = '<div class="msg">Le bilan de l’association n’est pas ouvert pour l’instant.</div>'; return; }
  render(data);
})();
</script>
</body>
</html>
